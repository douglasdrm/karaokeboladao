<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KARAOKE PARTY | Painel Admin Master</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@300;400;600&display=swap');
        
        :root {
            --bg: #060612;
            --accent: #d946ef;
            --blue: #00f2ff;
            --glass: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: white;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 20px;
            background: var(--glass);
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 2px;
            font-size: 1.5rem;
            background: linear-gradient(90deg, var(--accent), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .stat-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .stat-card .value { font-size: 2.5rem; font-weight: 900; color: var(--blue); }
        .stat-card .label { font-size: 0.8rem; opacity: 0.5; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px; }

        .section-title {
            font-family: 'Montserrat', sans-serif;
            margin: 40px 0 20px;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent);
        }

        .user-list {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow-x: auto;
            backdrop-filter: blur(10px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th {
            background: rgba(255,255,255,0.03);
            text-align: left;
            padding: 15px 20px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }

        td {
            padding: 10px 15px;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            vertical-align: middle;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-info img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .status-vip { background: rgba(0,255,0,0.1); color: #00ff00; border: 1px solid #00ff00; }
        .status-trial { background: rgba(255,165,0,0.1); color: #ffa500; border: 1px solid #ffa500; }
        .status-expired { background: rgba(255,0,0,0.1); color: #ff4444; border: 1px solid #ff4444; }
        .status-banned { background: #ff0000; color: white; border: 1px solid #ff0000; }

        .row-banned { opacity: 0.5; filter: grayscale(0.8); background: rgba(255,0,0,0.05) !important; }

        .action-group {
            display: flex;
            gap: 5px;
            align-items: center;
            white-space: nowrap;
        }

        .plan-select {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            color: white;
            padding: 6px;
            border-radius: 8px;
            font-size: 0.7rem;
            outline: none;
            cursor: pointer;
            width: 130px;
        }

        .plan-select option { background: var(--bg); }

        .btn-action {
            background: var(--glass);
            border: 1px solid var(--border);
            color: white;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.65rem;
            font-weight: 600;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-activate { border-color: #00ff00; color: #00ff00; }
        .btn-activate:hover { background: rgba(0,255,0,0.1); }
        .btn-cancel { border-color: #ff4444; color: #ff4444; }
        .btn-cancel:hover { background: rgba(255,0,0,0.1); }

        /* Abas Estilizadas */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(255,255,255,0.02);
            padding: 5px;
            border-radius: 15px;
            border: 1px solid var(--border);
            width: fit-content;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn.active {
            background: var(--accent);
            opacity: 1;
            box-shadow: 0 5px 15px rgba(217,70,239,0.3);
        }

        .tab-btn i { font-size: 0.9rem; }

        #loginOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .btn-login {
            background: white;
            color: black;
            padding: 18px 40px;
            border-radius: 50px;
            border: none;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .wa-btn {
            color: #25D366;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 600;
        }

        .wa-btn:hover { text-decoration: underline; }

        /* Loader */
        #loader {
            display: none;
            margin-top: 20px;
            color: var(--blue);
        }

        /* Dashboard do DJ (v16) */
        #djDashboard { display: none; margin-top: 20px; }
        .dj-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .dj-card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 25px; }
        .dj-card h3 { font-family: 'Montserrat', sans-serif; font-size: 0.9rem; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .badge-system { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .badge-icon { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; opacity: 0.2; transition: 0.3s; background: rgba(255,255,255,0.05); }
        .badge-icon.unlocked { opacity: 1; box-shadow: 0 0 15px currentColor; border: 2px solid currentColor; }
        .badge-bronze { color: #cd7f32; }
        .badge-silver { color: #c0c0c0; }
        .badge-gold { color: #ffd700; }

        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.85rem; }
        .progress-container-mini { flex: 1; height: 8px; background: rgba(255,255,255,0.05); border-radius: 10px; margin: 0 15px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--blue); transition: 0.5s; }
        
        .peak-bar-container { display: flex; align-items: flex-end; gap: 3px; height: 100px; margin-top: 20px; border-bottom: 1px solid var(--border); }
        .peak-bar { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; transition: 0.5s; position: relative; min-height: 2px; }
        .peak-bar:hover::after { content: attr(data-label); position: absolute; top: -25px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; white-space: nowrap; background: #000; padding: 2px 5px; border-radius: 4px; }
        
        .hall-fame-table { width: 100%; font-size: 0.75rem; border-collapse: collapse; }
        .hall-fame-table th { opacity: 0.5; font-weight: 400; text-align: left; padding: 5px; border-bottom: 1px solid var(--border); }
        .hall-fame-table td { padding: 8px 5px; border-bottom: 1px dotted var(--border); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <img src="../Assets/logo.png" style="width: 80px; margin-bottom: 30px;">
        <button class="btn-login" onclick="login()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" width="24">
            ENTRAR NA MINHA CABINE
        </button>
        <div id="loader"><i class="fas fa-spinner fa-spin"></i> Validando acesso...</div>
    </div>

    <div class="container">
        <header>
            <div>
                <h1>ADMIN DASHBOARD</h1>
                <p style="font-size: 0.7rem; opacity: 0.5;">Gestão de DJs e Monetização</p>
            </div>
            <div style="display:flex; gap:12px;">
                <button class="btn-action" style="border-color:var(--blue); color:var(--blue); padding: 10px 20px;" onclick="exportLeadsCSV()">
                    <i class="fas fa-file-csv"></i> EXPORTAR LEADS
                </button>
                <button class="btn-action" style="padding: 10px 20px;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> SAIR</button>
            </div>
        </header>

        <div id="masterView" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="value" id="statTotalUsers">0</div>
                    <div class="label">Total de DJs</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="statActiveSubs">0</div>
                    <div class="label">VIPs Ativos</div>
                </div>
                <div class="stat-card">
                    <div class="value" id="statTrialCount">0</div>
                    <div class="label">DJs em Trial</div>
                </div>
            </div>

            <div class="admin-tabs">
                <button class="tab-btn active" onclick="switchAdminTab('all', this)"><i class="fas fa-users"></i> TODOS DJs</button>
                <button class="tab-btn" onclick="switchAdminTab('vip', this)"><i class="fas fa-crown" style="color:#FFD700;"></i> VIPS</button>
                <button class="tab-btn" onclick="switchAdminTab('trial', this)"><i class="fas fa-hourglass-half"></i> EM TRIAL</button>
                <button class="tab-btn" onclick="switchAdminTab('leads', this)"><i class="fas fa-microphone"></i> CANTORES / LEADS</button>
            </div>

            <div class="user-list">
                <table id="mainAdminTable">
                    <thead id="tableHeader">
                        <!-- Cabeçalho Dinâmico -->
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Gerado via JS -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- DJ PERSONAL DASHBOARD (v16) -->
        <div id="djDashboard">
            <div class="dj-grid">
                <!-- Card Status -->
                <div class="dj-card">
                    <h3>💎 Minha Assinatura</h3>
                    <div id="djPlanBadge" style="margin-bottom: 15px;"></div>
                    <div class="stat-row">
                        <span>Expira em:</span>
                        <strong id="djExpDate">—</strong>
                    </div>
                    <div class="stat-row">
                        <span>Total de Músicas:</span>
                        <strong id="djTotalSongs">0</strong>
                    </div>
                    <div class="badge-system" id="djBadges">
                        <div class="badge-icon badge-bronze" title="Bronze: 50 músicas"><i class="fas fa-medal"></i></div>
                        <div class="badge-icon badge-silver" title="Prata: 200 músicas"><i class="fas fa-award"></i></div>
                        <div class="badge-icon badge-gold" title="Ouro: 500 músicas"><i class="fas fa-crown"></i></div>
                    </div>
                </div>

                <!-- Hall da Fama -->
                <div class="dj-card">
                    <h3>🏆 Hall da Fama (Top Notas)</h3>
                    <table class="hall-fame-table">
                        <thead><tr><th>Cantor</th><th>Música</th><th>Nota</th></tr></thead>
                        <tbody id="djHallFame"></tbody>
                    </table>
                </div>

                <!-- Estilos / Gêneros -->
                <div class="dj-card">
                    <h3>🎵 Gêneros mais Pedidos</h3>
                    <div id="djGenreStats"></div>
                </div>

                <!-- Horário de Pico -->
                <div class="dj-card" style="grid-column: span 1;">
                    <h3>🔥 Horário de Pico (Bombando)</h3>
                    <div class="peak-bar-container" id="djPeakGraph"></div>
                    <div style="display:flex; justify-content:space-between; margin-top:5px; font-size:0.6rem; opacity:0.5;">
                        <span>00h</span><span>06h</span><span>12h</span><span>18h</span><span>23h</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCnZ8hoE3NGNx2t490Yw12AxlCqVjSguig",
            authDomain: "karaoke-party-online.firebaseapp.com",
            databaseURL: "https://karaoke-party-online-default-rtdb.firebaseio.com",
            projectId: "karaoke-party-online",
            storageBucket: "karaoke-party-online.firebasestorage.app",
            messagingSenderId: "1059879567957",
            appId: "1:1059879567957:web:d4cb88563b39fe08934adc"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        const ADMIN_EMAIL = "douglasdrm@gmail.com"; 

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginOverlay').style.display = 'none';
                if (user.email === ADMIN_EMAIL) {
                    document.getElementById('masterView').style.display = 'block';
                    loadData();
                } else {
                    document.getElementById('djDashboard').style.display = 'block';
                    loadDJData(user.uid);
                }
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
            }
        });

        function login() {
            document.getElementById('loader').style.display = 'block';
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithRedirect(provider);
        }

        function logout() {
            auth.signOut().then(() => location.reload());
        }

        let currentFilter = 'all';

        function switchAdminTab(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (el) el.classList.add('active');
            loadData();
        }

        function loadData() {
            db.ref('users').on('value', snap => {
                const users = snap.val() || {};
                const tbody = document.getElementById('userTableBody');
                const thead = document.getElementById('tableHeader');
                tbody.innerHTML = '';
                
                // Configura Cabeçalho conforme o Filtro
                if (currentFilter === 'leads') {
                    thead.innerHTML = `<tr><th>Nome / E-mail</th><th>WhatsApp</th><th>Última Atividade</th><th>Ação</th></tr>`;
                } else {
                    thead.innerHTML = `<tr><th>DJ / E-mail</th><th>Status</th><th>WhatsApp</th><th>Plano</th><th>Vencimento</th><th>Ações Rápidas</th></tr>`;
                }

                let totalHost = 0, activeVIP = 0, inTrial = 0;

                Object.entries(users).forEach(([uid, user]) => {
                    const sub = user.subscription || { active: false, status: 'trial', plan: 'Gratuito' };
                    let isExpired = sub.expiresAt && sub.expiresAt < Date.now();

                    // Stats Globais (Sempre conta todos os hosts)
                    if (user.isHost) {
                        totalHost++;
                        if (sub.active && !isExpired) activeVIP++;
                        else if (!isExpired) inTrial++;
                    }

                    // FILTRAGEM PARA RENDERIZAÇÃO
                    if (currentFilter === 'leads' && user.isHost) return;
                    if (currentFilter !== 'leads' && !user.isHost) return;
                    if (currentFilter === 'vip' && (!sub.active || isExpired)) return;
                    if (currentFilter === 'trial' && (sub.active || isExpired)) return;

                    const tr = document.createElement('tr');
                    
                    if (user.isHost) {
                        const expDate = sub.expiresAt ? new Date(sub.expiresAt).toLocaleDateString('pt-BR') : '—';
                        const statusClass = sub.active && !isExpired ? 'status-vip' : (isExpired ? 'status-expired' : 'status-trial');
                        const statusText = sub.active && !isExpired ? 'VIP ATIVO' : (isExpired ? 'EXPIRADO' : 'TRIAL');
                        
                        // WhatsApp com ícone compacto
                        const waHtml = user.whatsapp ? `
                            <a href="https://wa.me/55${user.whatsapp.replace(/\D/g,'')}" class="wa-btn" target="_blank" title="${user.whatsapp}">
                                <i class="fab fa-whatsapp" style="font-size:1.2rem;"></i>
                            </a>` : '<i class="fab fa-whatsapp" style="opacity:0.2; font-size:1.2rem;" title="Não informado"></i>';

                        tr.innerHTML = `
                            <td>
                                <div class="user-info">
                                    <img src="${user.photo || ''}" onerror="this.src='https://via.placeholder.com/38'">
                                    <div>
                                        <div style="font-weight:600;">${user.name}</div>
                                        <div style="font-size:0.65rem; opacity:0.5;">${user.email}</div>
                                    </div>
                                </div>
                            </td>
                            <td><span class="status-badge ${user.isBanned ? 'status-banned' : statusClass}">${user.isBanned ? 'BANIDO' : statusText}</span></td>
                            <td style="text-align:center;">${waHtml}</td>
                            <td style="opacity:0.8;">${sub.plan || 'Gratuito'}</td>
                            <td style="font-weight:600;">${expDate}</td>
                            <td>
                                <div class="action-group">
                                    <select class="plan-select" id="sel-${uid}">
                                        <option value="casual">Casual (30d)</option>
                                        <option value="festa">Festa (90d)</option>
                                        <option value="anual">Anual (365d)</option>
                                        <option value="vitalicio">Vitalício</option>
                                    </select>
                                    <button class="btn-action btn-activate" onclick="applyPlan('${uid}')">OK</button>
                                    <button class="btn-action btn-cancel" onclick="cancelSub('${uid}')" title="Reset Trial"><i class="fas fa-undo"></i></button>
                                    <button class="btn-action" onclick="toggleBan('${uid}', ${!!user.isBanned})" style="color:${user.isBanned ? '#00ff00' : '#ff0000'}; border-color:${user.isBanned ? '#00ff00' : '#ff0000'};" title="${user.isBanned ? 'Desbanir' : 'Banir'}">
                                        <i class="fas ${user.isBanned ? 'fa-user-check' : 'fa-user-slash'}"></i>
                                    </button>
                                </div>
                            </td>
                        `;
                    } else {
                        // RENDERIZAÇÃO LEADS
                        const date = user.lastLogin ? new Date(user.lastLogin).toLocaleDateString('pt-BR') : '—';
                        const waHtml = user.whatsapp ? `
                            <a href="https://wa.me/55${user.whatsapp.replace(/\D/g,'')}" class="wa-btn" target="_blank">
                                <i class="fab fa-whatsapp"></i> ${user.whatsapp}
                            </a>` : '<i class="fab fa-whatsapp" style="opacity:0.2;"></i> —';

                        tr.innerHTML = `
                            <td>
                                <div class="user-info">
                                    <img src="${user.photo || ''}" onerror="this.src='https://via.placeholder.com/38'">
                                    <div>
                                        <div style="font-weight:600;">${user.name}</div>
                                        <div style="font-size:0.65rem; opacity:0.5;">${user.email}</div>
                                    </div>
                                </div>
                            </td>
                            <td>${waHtml}</td>
                            <td style="opacity:0.6;">${date}</td>
                            <td>
                                <div class="action-group">
                                    ${user.whatsapp ? `
                                    <button class="btn-action btn-activate" onclick="window.open('https://wa.me/55${user.whatsapp.replace(/\D/g,'')}?text=Olá ${encodeURIComponent(user.name.split(' ')[0])}, tudo bem? Vi que você curtiu o nosso Karaokê!')">
                                        <i class="fab fa-whatsapp"></i> CONTATO
                                    </button>
                                    ` : ''}
                                    <button class="btn-action" onclick="toggleBan('${uid}', ${!!user.isBanned})" style="color:${user.isBanned ? '#00ff00' : '#ff0000'}; border-color:${user.isBanned ? '#00ff00' : '#ff0000'};" title="${user.isBanned ? 'Desbanir' : 'Banir'}">
                                        <i class="fas ${user.isBanned ? 'fa-user-check' : 'fa-user-slash'}"></i>
                                    </button>
                                </div>
                            </td>
                        `;
                    }
                    if (user.isBanned) tr.classList.add('row-banned');
                    tbody.appendChild(tr);
                });

                document.getElementById('statTotalUsers').innerText = totalHost;
                document.getElementById('statActiveSubs').innerText = activeVIP;
                document.getElementById('statTrialCount').innerText = inTrial;
            });
        }

        function loadDJData(uid) {
            db.ref('users/' + uid).on('value', snap => {
                const data = snap.val() || {};
                const stats = data.stats || { totalSongsPlayed: 0, genres: {}, stats_records: [], peakHours: {} };
                const sub = data.subscription || { plan: 'Gratuito', expiresAt: 0, active: false };
                
                // 1. Assinatura e Status
                const isPremium = sub.active && (sub.expiresAt > Date.now());
                document.getElementById('djPlanBadge').innerHTML = `
                    <span class="status-badge ${isPremium ? 'status-vip' : 'status-expired'}">
                        ${sub.plan.toUpperCase()} ${isPremium ? 'ATIVO' : 'EXPIRADO'}
                    </span>
                `;
                document.getElementById('djExpDate').innerText = sub.expiresAt ? new Date(sub.expiresAt).toLocaleDateString('pt-BR') : '—';
                document.getElementById('djTotalSongs').innerText = stats.totalSongsPlayed || 0;

                // 2. Badges de Gamificação
                const badges = document.querySelectorAll('#djBadges .badge-icon');
                const counts = stats.totalSongsPlayed || 0;
                if (counts >= 50) badges[0].classList.add('unlocked');
                if (counts >= 200) badges[1].classList.add('unlocked');
                if (counts >= 500) badges[2].classList.add('unlocked');

                // 3. Hall da Fama (Top Notas)
                const hfBody = document.getElementById('djHallFame');
                hfBody.innerHTML = '';
                const records = stats.stats_records || [];
                records.forEach(r => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${r.singer}</td><td>${r.song}</td><td style="color:var(--blue); font-weight:900;">${r.score}</td>`;
                    hfBody.appendChild(tr);
                });
                if(records.length === 0) hfBody.innerHTML = '<tr><td colspan="3" style="text-align:center; opacity:0.3; padding:20px;">Nenhum recorde ainda</td></tr>';

                // 4. Gêneros Favoritos
                const genreContainer = document.getElementById('djGenreStats');
                genreContainer.innerHTML = '';
                const genres = stats.genres || {};
                const sortedGenres = Object.entries(genres).sort((a,b) => b[1] - a[1]).slice(0, 5);
                const totalG = Object.values(genres).reduce((a,b) => a+b, 0) || 1;
                
                sortedGenres.forEach(([name, count]) => {
                    const pct = Math.round((count / totalG) * 100);
                    genreContainer.innerHTML += `
                        <div class="stat-row">
                            <span style="width:80px; overflow:hidden; text-overflow:ellipsis;">${name}</span>
                            <div class="progress-container-mini"><div class="progress-fill" style="width:${pct}%;"></div></div>
                            <span style="width:30px; text-align:right;">${pct}%</span>
                        </div>
                    `;
                });
                if(sortedGenres.length === 0) genreContainer.innerHTML = '<p style="text-align:center; opacity:0.3; padding:20px;">Sem dados de gênero</p>';

                // 5. Horário de Pico
                const peakGraph = document.getElementById('djPeakGraph');
                peakGraph.innerHTML = '';
                const peakData = stats.peakHours || {};
                const maxPeak = Math.max(...Object.values(peakData), 1);
                
                for(let h=0; h<24; h++) {
                    const val = peakData[h] || 0;
                    const hPct = (val / maxPeak) * 100;
                    const bar = document.createElement('div');
                    bar.className = 'peak-bar';
                    bar.style.height = `${Math.max(2, hPct)}%`;
                    bar.setAttribute('data-label', `${h}h: ${val} ped.`);
                    peakGraph.appendChild(bar);
                }
            });
        }

        function toggleBan(uid, wasBanned) {
            const action = wasBanned ? 'DESBANIR' : 'BANIR';
            if (!confirm(`Deseja realmente ${action} este usuário?`)) return;
            
            db.ref('users/' + uid).update({
                isBanned: !wasBanned,
                bannedAt: !wasBanned ? firebase.database.ServerValue.TIMESTAMP : null
            }).then(() => {
                alert(`Usuário ${wasBanned ? 'desbloqueado' : 'banido'} com sucesso.`);
            });
        }

        function applyPlan(uid) {
            const sel = document.getElementById('sel-' + uid);
            const planKey = sel.value;
            
            let days = 0;
            if(planKey === 'casual') days = 30;
            else if(planKey === 'festa') days = 90;
            else if(planKey === 'anual') days = 365;
            else if(planKey === 'vitalicio') days = 36500; // 100 anos

            const expiration = Date.now() + (days * 24 * 60 * 60 * 1000);
            const planNames = { casual: 'Casual', festa: 'Festa', anual: 'Anual', vitalicio: 'Vitalício' };
            
            db.ref('users/' + uid + '/subscription').update({
                active: true,
                status: 'active',
                plan: planNames[planKey],
                expiresAt: expiration,
                lastUpdate: firebase.database.ServerValue.TIMESTAMP,
                updatedBy: 'admin_manual'
            }).then(() => {
                alert(`Sucesso! Plano ${planNames[planKey].toUpperCase()} ativado.`);
            });
        }

        function cancelSub(uid) {
            if (!confirm("Deseja resetar a assinatura deste usuário?")) return;
            db.ref('users/' + uid + '/subscription').set({
                active: false,
                status: 'trial',
                plan: 'Free Trial',
                expiresAt: 0
            });
            db.ref('users/' + uid + '/trialUsedMs').set(0);
        }

        function exportLeadsCSV() {
            db.ref('users').once('value', snap => {
                const users = snap.val() || {};
                let csvContent = "data:text/csv;charset=utf-8,Nome,Email,WhatsApp,Tipo,Status,Plano,Vencimento\n";
                
                Object.values(users).forEach(u => {
                    const type = u.isHost ? "DJ/Host" : "Cantor/Lead";
                    const sub = u.subscription || {};
                    const exp = sub.expiresAt ? new Date(sub.expiresAt).toLocaleDateString('pt-BR') : '—';
                    const whatsapp = u.whatsapp || "—";
                    const line = `"${u.name || ''}","${u.email || ''}","${whatsapp}","${type}","${sub.status || 'trial'}","${sub.plan || '—'}","${exp}"`;
                    csvContent += line + "\n";
                });

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "leads_karaoke_SaaS.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }
    </script>
</body>
